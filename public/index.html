<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<style>
  /* Warm dark - espresso ground, brass accent. The winning word is the only
     saturated thing on the page, so the eye lands on what the vote decided. */
  :root {
    --ground:   #15110D;
    --raise:    #1D1813;
    --sunk:     #100D09;
    --ink:      #F2E9DC;
    --muted:    #A89684;
    --faint:    #756554;
    --rule:     #2B2219;
    --rule-lit: #3A2E22;
    --brass:    #E3A44A;
    --brass-dim:#6B4F20;
    --clay:     #C4705E;
    --ember:    #E0563F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Karla, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 72px 28px 140px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* ---------- masthead ---------- */
  header { margin-bottom: 44px; }
  h1 {
    font-family: Spectral, Georgia, serif;
    font-weight: 300; font-size: 46px; line-height: 1;
    letter-spacing: -0.02em; margin: 0 0 10px;
  }
  .tag {
    color: var(--muted); font-size: 16px; font-weight: 400;
    font-family: Spectral, Georgia, serif; font-style: italic;
  }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px; vertical-align: 11px; margin-left: 12px;
    background: rgba(227,164,74,.1); color: var(--brass);
    border: 1px solid var(--brass-dim);
  }

  /* ---------- the control ---------- */
  .mic {
    width: 100%; padding: 26px; cursor: pointer;
    background: var(--raise); border: 1px solid var(--rule);
    border-radius: 2px; color: var(--ink);
    font-family: Karla, sans-serif; font-size: 15px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    transition: border-color .18s, background .18s;
    user-select: none; -webkit-user-select: none;
  }
  .mic:hover { border-color: var(--rule-lit); }
  .mic.live { background: #241410; border-color: var(--ember); }
  .mic .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint); margin-right: 12px; vertical-align: 2px;
  }
  .mic.live .dot { background: var(--ember); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }

  .hint {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    margin-top: 14px; color: var(--faint); font-size: 13px;
  }
  .hint b {
    font-family: "IBM Plex Mono", monospace; font-weight: 400;
    color: var(--muted); font-size: 12px;
  }
  .replay {
    background: none; border: 1px solid var(--rule); color: var(--muted);
    border-radius: 2px; padding: 5px 12px; cursor: pointer;
    font-family: Karla, sans-serif; font-size: 12px; font-weight: 500;
  }
  .replay:hover { border-color: var(--rule-lit); color: var(--ink); }
  .mic:focus-visible, .replay:focus-visible {
    outline: 1px solid var(--brass); outline-offset: 3px;
  }

  /* ---------- sections ---------- */
  section { margin-top: 46px; }
  h2 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px; font-weight: 400; letter-spacing: .18em;
    text-transform: uppercase; color: var(--faint);
    margin: 0 0 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---------- the verdict ---------- */
  .final {
    font-family: Spectral, Georgia, serif;
    font-size: 27px; font-weight: 300; line-height: 1.52;
    letter-spacing: -0.01em; padding: 4px 0 2px;
  }
  .final .fixed {
    color: var(--brass); font-weight: 400;
    box-shadow: inset 0 -1px 0 0 var(--brass-dim);
  }

  .timing {
    display: flex; gap: 26px; flex-wrap: wrap; margin-top: 26px;
    padding-top: 18px; border-top: 1px solid var(--rule);
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--faint); font-variant-numeric: tabular-nums;
  }
  .timing b { color: var(--ink); font-weight: 500; }
  .timing i { color: var(--ember); font-style: normal; }

  /* ---------- lanes ---------- */
  .lane {
    display: grid; grid-template-columns: 168px 1fr; gap: 24px;
    padding: 18px 0; border-bottom: 1px solid var(--rule); align-items: baseline;
  }
  .lane:last-child { border-bottom: none; }
  .lane .who {
    font-size: 12px; line-height: 1.45; color: var(--faint);
  }
  .lane .who b {
    display: block; margin-bottom: 3px;
    font-family: Karla, sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  .lane .said {
    font-family: Spectral, Georgia, serif;
    font-size: 17px; font-weight: 300; line-height: 1.55; color: #C9BCAC;
  }
  .lane .said .won { color: var(--brass); font-weight: 500; }
  .lane .said .lost { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .lane .said .dropped { color: var(--ember); font-style: italic; font-size: 15px; }

  /* ---------- ballots ---------- */
  .dispute { margin-bottom: 22px; }
  .dispute .head {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--faint); margin-bottom: 10px;
    letter-spacing: .04em;
  }
  .dispute .head b {
    font-family: Spectral, Georgia, serif; font-size: 15px;
    font-weight: 500; color: var(--brass); letter-spacing: 0;
  }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt {
    display: inline-flex; align-items: baseline; gap: 9px;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 7px 12px; background: var(--sunk);
    font-family: Spectral, Georgia, serif; font-size: 14px;
    color: var(--faint);
  }
  .opt.won {
    border-color: var(--brass-dim); color: var(--brass);
    background: rgba(227,164,74,.06);
  }
  .opt .c {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
    opacity: .7; font-variant-numeric: tabular-nums;
  }

  /* ---------- states ---------- */
  .err {
    border: 1px solid #4A2A22; background: #1F1310; color: #E8A392;
    border-radius: 2px; padding: 16px 18px; font-size: 14px; line-height: 1.6;
  }
  .err b { color: var(--clay); }
  .err code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--brass); }
  .idle {
    font-family: Spectral, Georgia, serif; font-style: italic;
    color: var(--faint); font-size: 17px; font-weight: 300;
  }

  @media (max-width: 620px) {
    body { padding: 48px 20px 90px; }
    h1 { font-size: 36px; }
    .final { font-size: 22px; }
    .lane { grid-template-columns: 1fr; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quorum<span class="badge" id="mode" hidden></span></h1>
    <div class="tag" id="tag">One recording, heard several ways. Keep the best words.</div>
  </header>

  <button class="mic" id="mic"><span class="dot"></span><span id="micLabel">Hold to talk</span></button>
  <div class="hint">
    or hold <b>space</b>
    <button class="replay" id="replay" hidden>Replay last clip</button>
  </div>

  <div id="out">
    <section><div class="idle">Say something with a name or a technical term in it.</div></section>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
